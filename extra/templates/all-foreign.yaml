mixed-port: 7897
allow-lan: false
mode: rule
log-level: info
ipv6: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat"
  geosite: "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

find-process-mode: always
profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: false
  device: velumvpn
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
  mtu: 1500

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "time.*.com"
    - "ntp.*.com"
    - "+.market.xiaomi.com"
  use-hosts: false
  use-system-hosts: false
  default-nameserver:
    - "77.88.8.8"
    - "77.88.1.1"
  nameserver:
    - "77.88.8.8"
    - "77.88.1.1"
    - "https://common.dot.dns.yandex.net/dns-query"
  proxy-server-nameserver:
    - "system"
    - "77.88.8.8"
    - "77.88.1.1"
  direct-nameserver:
    - "system"
    - "77.88.8.8"
    - "77.88.1.1"
  respect-rules: false

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 443]
      override-destination: true
    TLS:
      ports: [443]
    QUIC:
      ports: [443]
  skip-dst-address:
    - "91.105.192.0/23"
    - "91.108.4.0/22"
    - "91.108.8.0/21"
    - "91.108.16.0/21"
    - "91.108.56.0/22"
    - "95.161.64.0/20"
    - "149.154.160.0/20"
    - "185.76.151.0/24"
    - "2001:67c:4e8::/48"
    - "2001:b28:f23c::/47"
    - "2001:b28:f23f::/48"
    - "2a0a:f280:203::/48"

proxy-groups:
  - name: "→ VelumVPN"
    type: select
    proxies:
      - "Случайный сервер"
      - "Без Proxy"
    remnawave:
      include-proxies: true

  - name: "Без Proxy"
    type: select
    proxies:
      - DIRECT

  - name: "Случайный сервер"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 200
    proxies: []
    remnawave:
      include-proxies: true

# Российские IP идут напрямую, всё остальное через VPN
rules:
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,private,DIRECT
  # RadminVPN — виртуальная сеть напрямую
  - IP-CIDR,26.0.0.0/8,DIRECT,no-resolve
  - GEOSITE,category-ads-all,REJECT
  # Торрент-клиенты — напрямую. Регулярка ловит по имени процесса любой клиент со словом
  # "torrent" (в любом регистре), даже если его тут нет явно; остальные — по именам ниже,
  # так как их названия этого слова не содержат.
  - PROCESS-NAME-REGEX,(?i).*torrent.*,DIRECT
  - PROCESS-NAME,qbittorrent.exe,DIRECT
  - PROCESS-NAME,qbittorrent,DIRECT
  - PROCESS-NAME,qbittorrent-nox,DIRECT
  - PROCESS-NAME,utorrent.exe,DIRECT
  - PROCESS-NAME,bittorrent.exe,DIRECT
  - PROCESS-NAME,transmission-qt.exe,DIRECT
  - PROCESS-NAME,transmission-gtk,DIRECT
  - PROCESS-NAME,transmission-daemon,DIRECT
  - PROCESS-NAME,transmission-remote,DIRECT
  - PROCESS-NAME,Transmission,DIRECT
  - PROCESS-NAME,deluge.exe,DIRECT
  - PROCESS-NAME,deluged,DIRECT
  - PROCESS-NAME,deluge-gtk,DIRECT
  - PROCESS-NAME,tixati.exe,DIRECT
  - PROCESS-NAME,Vuze.exe,DIRECT
  - PROCESS-NAME,vuze,DIRECT
  - PROCESS-NAME,azureus.exe,DIRECT
  - PROCESS-NAME,BitComet.exe,DIRECT
  - PROCESS-NAME,bitcomet.exe,DIRECT
  - PROCESS-NAME,FrostWire.exe,DIRECT
  - PROCESS-NAME,Motrix.exe,DIRECT
  - PROCESS-NAME,motrix,DIRECT
  - PROCESS-NAME,Folx,DIRECT
  - PROCESS-NAME,rtorrent,DIRECT

  # Игровые сервисы — CDN и загрузки напрямую
  - DOMAIN-SUFFIX,steampowered.com,DIRECT
  - DOMAIN-SUFFIX,steamcontent.com,DIRECT
  - DOMAIN-SUFFIX,steamcdn-a.akamaihd.net,DIRECT
  - DOMAIN-SUFFIX,ea.com,DIRECT
  - DOMAIN-SUFFIX,eaassets-a.akamaihd.net,DIRECT
  - DOMAIN-SUFFIX,ubisoft.com,DIRECT
  - DOMAIN-SUFFIX,ubi.com,DIRECT
  - DOMAIN-SUFFIX,hoyoverse.com,DIRECT
  - DOMAIN-SUFFIX,mihoyo.com,DIRECT
  - DOMAIN-SUFFIX,yuanshen.com,DIRECT
  - GEOIP,ru,DIRECT
  - MATCH,→ VelumVPN

# Пользовательская зона — правила здесь сохраняются при обновлении приложения.
# Добавляй свои правила в список ниже, они будут работать перед MATCH.
# Примеры:
#   x-velum-user-rules:
#     - DOMAIN-SUFFIX,mysite.com,DIRECT
#     - PROCESS-NAME,myapp.exe,→ VelumVPN
x-velum-user-rules: []
